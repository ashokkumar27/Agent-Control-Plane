[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-plane"
version = "0.2.0"
description = "Developer-friendly and governance-team-friendly control plane for safe AI agent tool use."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Agent Control Plane Contributors" }]
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentctl = "agent_control_plane.cli:main"

[tool.setuptools.packages.find]
include = ["agent_control_plane*"]
